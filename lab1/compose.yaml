# Lab 1 — IoT architecture and first MQTT messages.
#   start:  sudo docker compose up -d --build
#   work:   sudo docker compose exec workstation bash
#   stop:   sudo docker compose down

name: lab1

services:
  broker:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  relay:
    build: ./tools
    image: lab1-tools:1
    command: python relay.py
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - broker
    restart: unless-stopped

  plant:
    build: ./tools
    image: lab1-tools:1
    command: python plant.py
    depends_on:
      - relay
    restart: unless-stopped

  workstation:
    build: ./tools
    image: lab1-tools:1
    hostname: workstation
    command: sleep infinity
    working_dir: /work
    volumes:
      - ./work:/work
    depends_on:
      - relay
    restart: unless-stopped
