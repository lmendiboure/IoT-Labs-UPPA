# TLS required; the old plaintext MQTT port 1883 is no longer offered.
listener 8883
certfile /mosquitto/config/tls/server.crt
keyfile /mosquitto/config/tls/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /tmp/lab3-passwords
acl_file /mosquitto/config/policy.acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
