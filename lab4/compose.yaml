name: lab4

x-tools-build: &tools-build
  context: ./tools
  args:
    HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
    HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
    NO_PROXY: ${NO_PROXY:-${no_proxy:-}}

services:
  site-broker:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [site]
    restart: unless-stopped

  cloud-broker:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [cloud]
    restart: unless-stopped

  edge:
    build: *tools-build
    image: lab4-tools:1
    command: python edge_service.py
    volumes:
      - ./work:/work:ro
      - ./control:/control:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [site]
    depends_on: [site-broker]
    restart: unless-stopped

  uplink:
    build: *tools-build
    image: lab4-tools:1
    command: python uplink.py
    volumes:
      - ./control:/control:ro
    networks: [site, cloud]
    depends_on: [site-broker, cloud-broker]
    restart: unless-stopped

  cloud:
    build: *tools-build
    image: lab4-tools:1
    command: python cloud_service.py
    ports:
      - "127.0.0.1:8081:8081"
    networks: [cloud]
    depends_on: [cloud-broker]
    restart: unless-stopped

  workstation:
    build: *tools-build
    image: lab4-tools:1
    command: sleep infinity
    working_dir: /work
    volumes:
      - ./work:/work
    networks: [site, cloud]
    depends_on: [edge, cloud, uplink]
    restart: unless-stopped

networks:
  site:
  cloud:
